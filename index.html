<script>
(function(){
function mulberry32(seed){return function(){let t=(seed+=0x6D2B79F5);t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
const PAIRS=[{symbol:'BTCUSDT',price:67421.50,base:'BTC'},{symbol:'ETHUSDT',price:3542.80,base:'ETH'},{symbol:'SOLUSDT',price:178.45,base:'SOL'},{symbol:'BNBUSDT',price:612.30,base:'BNB'},{symbol:'XRPUSDT',price:0.5621,base:'XRP'},{symbol:'AVAXUSDT',price:34.82,base:'AVAX'},{symbol:'ARBUSDT',price:0.8945,base:'ARB'},{symbol:'LINKUSDT',price:14.72,base:'LINK'},{symbol:'DOGEUSDT',price:0.1623,base:'DOGE'},{symbol:'INJUSDT',price:24.18,base:'INJ'}];
function genTrades(){const rng=mulberry32(42),trades=[],now=Date.now();let id=10240;for(let i=0;i<286;i++){const pair=PAIRS[Math.floor(rng()*PAIRS.length)],side=rng()>.46?'LONG':'SHORT',openedAt=now-Math.floor(rng()*120*86400000),durationMin=5+Math.floor(rng()*600),isOpen=i<6,entryPrice=pair.price*(1+(rng()-.5)*.08),sizeUsd=200+Math.floor(rng()*4800),qty=sizeUsd/entryPrice,leverage=[3,5,5,10,10,20][Math.floor(rng()*6)],isWin=rng()<.64,pctMove=(isWin?1:-1)*(.004+rng()*.032),dir=side==='LONG'?1:-1,exitPrice=entryPrice*(1+pctMove*dir),fee=sizeUsd*.0008,notional=sizeUsd*(leverage/5),pnl=isOpen?(notional*pctMove*.6):(notional*pctMove);trades.push({id:'T-'+(id+i),pair:pair.symbol,base:pair.base,side,entryPrice,exitPrice:isOpen?null:exitPrice,qty,sizeUsd,leverage,pnl:pnl-(isOpen?0:fee),pnlPct:pctMove*100,fee,openedAt,closedAt:isOpen?null:openedAt+durationMin*60000,status:isOpen?'OPEN':'CLOSED',strategy:['Grid v3','Trend Rider','Mean Rev','Breakout'][Math.floor(rng()*4)]})}trades.sort((a,b)=>b.openedAt-a.openedAt);return trades}
const TRADES=genTrades();
function genEquityCurve(start=10000){const closed=TRADES.filter(t=>t.status==='CLOSED').slice().sort((a,b)=>a.closedAt-b.closedAt);let eq=start,peak=start;const s=[{t:closed[0]?.closedAt-86400000||Date.now()-120*86400000,equity:start,drawdown:0}];for(const tr of closed){eq+=tr.pnl;if(eq>peak)peak=eq;s.push({t:tr.closedAt,equity:+eq.toFixed(2),drawdown:+((eq-peak)/peak*100).toFixed(2)})}return s}
const EQUITY=genEquityCurve();
function genMonthly(){const rng=mulberry32(7);return['Oct','Nov','Dec','Jan','Feb','Mar','Apr','May'].map((m,i)=>({month:m,return:+((i===2||i===5)?-(1+rng()*3):(2+rng()*12)).toFixed(2),trades:28+Math.floor(rng()*40)}))}
const MONTHLY=genMonthly();
function genPairPerf(){const map={};for(const t of TRADES){if(t.status!=='CLOSED')continue;if(!map[t.pair])map[t.pair]={pair:t.pair,base:t.base,pnl:0,trades:0,wins:0};map[t.pair].pnl+=t.pnl;map[t.pair].trades++;if(t.pnl>0)map[t.pair].wins++}return Object.values(map).map(p=>({...p,pnl:+p.pnl.toFixed(2),winRate:+((p.wins/p.trades)*100).toFixed(1)})).sort((a,b)=>b.pnl-a.pnl)}
const PAIR_PERF=genPairPerf();
function genHourlyDist(){const rng=mulberry32(13),data=[];for(let d=0;d<7;d++)for(let h=0;h<24;h++)data.push({d,h,v:Math.max(0,Math.floor(Math.sin((h-6)*.4)*8+10+rng()*6))});return data}
const HOURLY=genHourlyDist();
function summary(){const closed=TRADES.filter(t=>t.status==='CLOSED'),wins=closed.filter(t=>t.pnl>0),losses=closed.filter(t=>t.pnl<=0),totalPnl=closed.reduce((s,t)=>s+t.pnl,0),grossWin=wins.reduce((s,t)=>s+t.pnl,0),grossLoss=Math.abs(losses.reduce((s,t)=>s+t.pnl,0)),startBalance=10000,openTrades=TRADES.filter(t=>t.status==='OPEN');return{balance:startBalance+totalPnl,totalPnl,winRate:(wins.length/closed.length)*100,profitFactor:grossLoss===0?99:grossWin/grossLoss,avgWin:grossWin/Math.max(1,wins.length),avgLoss:grossLoss/Math.max(1,losses.length),maxDD:Math.min(...EQUITY.map(e=>e.drawdown)),sharpe:1.94,totalTrades:closed.length,openTrades:openTrades.length,openPnl:openTrades.reduce((s,t)=>s+t.pnl,0),wins:wins.length,losses:losses.length,startBalance}}
window.MOCK={TRADES,EQUITY,MONTHLY,PAIR_PERF,HOURLY,SUMMARY:summary(),PAIRS};
})();
</script>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;

// Minimal SVG chart components (Recharts replacement)
const SvgArea = ({data, dk='equity', color='#c9f25c', fy=v=>v, refY=null, h=280}) => {
  if (!data?.length) return null;
  const W=800,H=h,L=64,R=14,T=10,B=24,iw=W-L-R,ih=H-T-B;
  const vs=data.map(d=>d[dk]);
  let mn=Math.min(...vs),mx=Math.max(...vs);
  if(refY!=null){mn=Math.min(mn,refY);mx=Math.max(mx,refY);}
  const pad=(mx-mn)*0.05||1; mn-=pad; mx+=pad;
  const rg=mx-mn||1;
  const xp=i=>L+iw*i/Math.max(1,data.length-1), yp=v=>T+ih-(v-mn)/rg*ih;
  const ln=data.map((d,i)=>(i?'L':'M')+xp(i).toFixed(1)+','+yp(d[dk]).toFixed(1)).join(' ');
  const ar=ln+`L${xp(data.length-1).toFixed(1)},${T+ih}L${L},${T+ih}Z`;
  const yt=[0,.25,.5,.75,1].map(t=>mn+rg*t);
  const xs=Math.max(1,Math.floor(data.length/6));
  const gid='g'+Math.random().toString(36).slice(2,8);
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" height="100%" preserveAspectRatio="none">
      <defs><linearGradient id={gid} x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stopColor={color} stopOpacity="0.4"/><stop offset="100%" stopColor={color} stopOpacity="0"/></linearGradient></defs>
      {yt.map((t,i)=><g key={i}><line x1={L} y1={yp(t)} x2={W-R} y2={yp(t)} stroke="#262e3c" strokeDasharray="2 4"/><text x={L-6} y={yp(t)+4} fill="#5a6070" fontSize="11" textAnchor="end" fontFamily="JetBrains Mono">{fy(t)}</text></g>)}
      {refY!=null && <g><line x1={L} y1={yp(refY)} x2={W-R} y2={yp(refY)} stroke="#5a6070" strokeDasharray="2 4"/><text x={W-R-2} y={yp(refY)-4} fill="#5a6070" fontSize="10" textAnchor="end" fontFamily="JetBrains Mono">Initial</text></g>}
      <path d={ar} fill={`url(#${gid})`}/>
      <path d={ln} fill="none" stroke={color} strokeWidth="2"/>
      {data.filter((_,i)=>i%xs===0).map((d,i)=>{const k=i*xs;return <text key={k} x={xp(k)} y={H-6} fill="#5a6070" fontSize="11" textAnchor="middle" fontFamily="JetBrains Mono">{d.label||''}</text>})}
    </svg>
  );
};

const SvgBars = ({data, dk='return', fy=v=>v, h=240, lk='month'}) => {
  const W=800,H=h,L=56,R=14,T=14,B=30,iw=W-L-R,ih=H-T-B;
  const vs=data.map(d=>d[dk]);
  const mn=Math.min(0,...vs),mx=Math.max(0,...vs),rg=mx-mn||1;
  const yp=v=>T+ih-(v-mn)/rg*ih;
  const bw=iw/data.length*0.65,bp=iw/data.length*0.175;
  const yt=[0,.25,.5,.75,1].map(t=>mn+rg*t);
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" height="100%" preserveAspectRatio="none">
      {yt.map((t,i)=><g key={i}><line x1={L} y1={yp(t)} x2={W-R} y2={yp(t)} stroke="#262e3c" strokeDasharray="2 4"/><text x={L-6} y={yp(t)+4} fill="#5a6070" fontSize="11" textAnchor="end" fontFamily="JetBrains Mono">{fy(t)}</text></g>)}
      <line x1={L} y1={yp(0)} x2={W-R} y2={yp(0)} stroke="#5a6070"/>
      {data.map((d,i)=>{const v=d[dk],x0=L+iw*i/data.length+bp,h0=Math.abs(v)/rg*ih,y0=v>=0?yp(v):yp(0);return <rect key={i} x={x0} y={y0} width={bw} height={h0} rx="3" fill={v>=0?'#18c19a':'#f4516c'}/>})}
      {data.map((d,i)=><text key={i} x={L+iw*(i+0.5)/data.length} y={H-8} fill="#5a6070" fontSize="11" textAnchor="middle" fontFamily="JetBrains Mono">{d[lk]||''}</text>)}
    </svg>
  );
};

  const paths = {
    dashboard:<><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></>,
    list:<><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1.2"/><circle cx="4" cy="12" r="1.2"/><circle cx="4" cy="18" r="1.2"/></>,
    chart:<><path d="M3 21V5"/><path d="M3 17l5-5 4 3 8-8"/><path d="M16 7h4v4"/></>,
    cog:<><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></>,
    bell:<><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9z"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></>,
    search:<><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></>,
    play:<path d="M6 4l14 8L6 20V4z"/>,
    pause:<><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></>,
    up:<path d="M7 14l5-5 5 5"/>,
    down:<path d="M7 10l5 5 5-5"/>,
    arrowRight:<path d="M5 12h14M13 6l6 6-6 6"/>,
    plus:<path d="M12 5v14M5 12h14"/>,
    download:<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></>,
    key:<><circle cx="7.5" cy="15.5" r="3.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></>,
    logout:<><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></>,
    circle:<circle cx="12" cy="12" r="4"/>,
    eye:<><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></>,
    eyeOff:<><path d="M17.9 17.9A10.7 10.7 0 0 1 12 19c-6 0-10-7-10-7a18.4 18.4 0 0 1 5.1-5.9M9.9 4.2A10.5 10.5 0 0 1 12 4c6 0 10 7 10 7a18.4 18.4 0 0 1-2.2 3"/><path d="m1 1 22 22"/><path d="M9.5 9.5a3 3 0 0 0 4.2 4.2"/></>,
    check:<path d="m5 12 5 5L20 7"/>,
    info:<><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></>,
    flash:<path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/>,
    shield:<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>,
    copy:<><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></>,
    wallet:<><path d="M20 12V8a2 2 0 0 0-2-2H5a2 2 0 0 1-2-2 2 2 0 0 1 2-2h14v4"/><path d="M3 6v12a2 2 0 0 0 2 2h15a2 2 0 0 0 2-2v-4h-5a2 2 0 0 1 0-4h5"/></>,
    target:<><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></>,
    activity:<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>,
  };
  return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>{paths[name]||null}</svg>;
};

const Logo=({size=22})=>(
  <div className="flex items-center gap-2.5">
    <div className="flex items-center justify-center rounded-[7px] shrink-0" style={{width:size*1.5,height:size*1.5,background:'linear-gradient(155deg,#dcf78d 0%,#a3cc3d 100%)'}}>
      <span className="font-display font-bold" style={{color:'#0a0e14',fontSize:size*.95,lineHeight:1}}>S</span>
    </div>
    <div className="font-display font-semibold tracking-tight text-fg0" style={{fontSize:size*.82}}>Sentinel<span className="text-gold">EA</span></div>
  </div>

const fmtUsd=(v,{decimals=2,sign=false}={})=>{if(v==null||isNaN(v))return'—';const s=(sign&&v>0?'+':'')+(v<0?'-':'');return s+'$'+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:decimals,maximumFractionDigits:decimals})};
const fmtPct=(v,d=2,sign=true)=>{if(v==null)return'—';return(sign&&v>0?'+':'')+v.toFixed(d)+'%'};
const fmtPrice=v=>{if(v==null)return'—';const d=v<1?4:2;return v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d})};
const relTime=ts=>{if(!ts)return'—';const d=(Date.now()-ts)/1000;if(d<60)return Math.floor(d)+'s ago';if(d<3600)return Math.floor(d/60)+'m ago';if(d<86400)return Math.floor(d/3600)+'h ago';return Math.floor(d/86400)+'d ago'};
const fmtDate=ts=>{if(!ts)return'—';const d=new Date(ts);return d.toLocaleDateString('en-US',{month:'short',day:'2-digit'})+' '+d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false})};

const PairToken=({base,size=22})=>{
  const colors={BTC:'#f7931a',ETH:'#627eea',SOL:'#9945ff',BNB:'#f0b90b',XRP:'#23292f',AVAX:'#e84142',ARB:'#28a0f0',LINK:'#2a5ada',DOGE:'#c2a633',INJ:'#00d2ff'};
  return <div className="flex items-center justify-center rounded-full font-display font-semibold text-white shrink-0" style={{width:size,height:size,background:colors[base]||'#3a4150',fontSize:size*.42}}>{base.slice(0,3)}</div>;
};

const Pill=({children,tone='default',className=''})=>{
  const t={default:'bg-bg3 text-fg1 border-line2',up:'bg-up/10 text-up border-up/30',down:'bg-down/10 text-down border-down/30',gold:'bg-gold/10 text-gold border-gold/30',muted:'bg-bg2 text-fg3 border-line'};
  return <span className={`inline-flex items-center gap-1 text-[10px] font-semibold uppercase tracking-wider border rounded px-1.5 py-0.5 ${t[tone]||t.default} ${className}`}>{children}</span>;
};

const Btn=({children,onClick,variant='default',size='md',icon,type='button',className='',disabled})=>{
  const v={primary:'bg-gold text-bg0 hover:bg-gold-2 border border-gold font-semibold',default:'bg-bg2 border border-line text-fg1 hover:bg-bg3 hover:text-fg0',ghost:'text-fg2 hover:text-fg0 hover:bg-bg2',danger:'bg-down/10 border border-down/30 text-down hover:bg-down/15'}[variant];
  const s={sm:'px-2.5 py-1.5 text-xs',md:'px-3.5 py-2 text-sm',lg:'px-4 py-2.5 text-sm'}[size];

};

const useLivePrices=()=>{
  const [prices,setPrices]=useState(()=>Object.fromEntries(window.MOCK.PAIRS.map(p=>[p.symbol,p.price])));
  const [flashes,setFlashes]=useState({});
  useEffect(()=>{
    const id=setInterval(()=>{
      setPrices(prev=>{
        const next={...prev},flash={};
        for(const p of window.MOCK.PAIRS){const drift=(Math.random()-.5)*.0025;next[p.symbol]=prev[p.symbol]*(1+drift);flash[p.symbol]=drift>0?'up':'down'}
        setFlashes(flash);return next;
      });
    },1800);
    return()=>clearInterval(id);
  },[]);
  return {prices,flashes};
};

          <div className="flex items-center gap-2 bg-bg2 border border-line rounded-md px-3 py-1.5 w-[260px]"><Icon name="search" size={14} className="text-fg3"/><input value={q} onChange={e=>{setQ(e.target.value);setPage(0)}} className="bg-transparent outline-none text-sm w-full placeholder:text-fg3" placeholder="Search pair or trade ID…"/></div>
          <Select label="Side" value={side} onChange={v=>{setSide(v);setPage(0)}} options={[{v:'all',l:'All'},{v:'LONG',l:'Long'},{v:'SHORT',l:'Short'}]}/>
          <Select label="Pair" value={pair} onChange={v=>{setPair(v);setPage(0)}} options={[{v:'all',l:'All pairs'},...window.MOCK.PAIRS.map(p=>({v:p.symbol,l:p.symbol}))]}/>
          <Select label="Status" value={status} onChange={v=>{setStatus(v);setPage(0)}} options={[{v:'all',l:'All'},{v:'OPEN',l:'Open'},{v:'CLOSED',l:'Closed'}]}/>
          <div className="ml-auto flex items-center gap-2">
            <div className="text-xs text-fg3"><span className="num text-fg1">{filtered.length}</span> results · <span className={`num font-medium ${totalPnl>=0?'text-up':'text-down'}`}>{fmtUsd(totalPnl,{sign:true})}</span> P&L · <span className="num text-fg1">{closed?((wins/closed)*100).toFixed(1):'0'}%</span> WR</div>
            <Btn variant="default" size="sm" icon="download">Export</Btn>
          </div>
        </div>
      </Card>
      <Card padded={false}>
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead><tr className="text-left text-[11px] uppercase tracking-wider text-fg3 border-b border-line"><th className="px-5 py-3 font-medium">Pair</th><th className="px-3 py-3 font-medium">Side</th><th className="px-3 py-3 font-medium">Strategy</th><th className="px-3 py-3 font-medium text-right">Size</th><th className="px-3 py-3 font-medium text-right">Entry</th><th className="px-3 py-3 font-medium text-right">Exit</th><th className="px-3 py-3 font-medium text-right">P&L</th><th className="px-3 py-3 font-medium text-right">P&L %</th><th className="px-3 py-3 font-medium">Opened</th><th className="px-3 py-3 font-medium">Status</th><th className="px-5 py-3"></th></tr></thead>
            <tbody>
              {pd.map(t=>(
                <tr key={t.id} className="border-b border-line/60 hover:bg-bg2/40 transition-colors">
                  <td className="px-5 py-3"><div className="flex items-center gap-2.5"><PairToken base={t.base} size={22}/><div><div className="font-medium font-display">{t.pair}</div><div className="text-[10px] text-fg3 font-mono">{t.id} · {t.leverage}×</div></div></div></td>
                  <td className="px-3 py-3"><Pill tone={t.side==='LONG'?'up':'down'}>{t.side}</Pill></td>
                  <td className="px-3 py-3 text-fg2 text-xs">{t.strategy}</td>
                  <td className="px-3 py-3 text-right num text-fg2">{fmtUsd(t.sizeUsd,{decimals:0})}</td>
                  <td className="px-3 py-3 text-right num text-fg1">{fmtPrice(t.entryPrice)}</td>
                  <td className="px-3 py-3 text-right num text-fg1">{t.exitPrice?fmtPrice(t.exitPrice):<span className="text-fg3">—</span>}</td>
                  <td className={`px-3 py-3 text-right num font-medium ${t.pnl>=0?'text-up':'text-down'}`}>{fmtUsd(t.pnl,{sign:true})}</td>
                  <td className={`px-3 py-3 text-right num text-xs ${t.pnl>=0?'text-up':'text-down'}`}>{fmtPct(t.pnlPct)}</td>
                  <td className="px-3 py-3 text-fg3 font-mono text-xs">{fmtDate(t.openedAt)}</td>
                  <td className="px-3 py-3"><Pill tone={t.status==='OPEN'?'gold':'muted'}>{t.status}</Pill></td>
                  <td className="px-5 py-3 text-right"><button className="text-fg3 hover:text-fg0 p-1"><Icon name="arrowRight" size={14}/></button></td>
                </tr>
              ))}
              {!pd.length&&<tr><td colSpan={11} className="px-5 py-16 text-center text-fg3 text-sm">No trades match these filters.</td></tr>}
            </tbody>
          </table>
        </div>
        <div className="flex items-center justify-between px-5 py-3 border-t border-line">
          <div className="text-xs text-fg3">Showing <span className="text-fg1 num">{page*PS+1}</span>–<span className="text-fg1 num">{Math.min((page+1)*PS,filtered.length)}</span> of <span className="text-fg1 num">{filtered.length}</span></div>
          <div className="flex items-center gap-1"><Btn variant="default" size="sm" disabled={page===0} onClick={()=>setPage(p=>Math.max(0,p-1))}>← Prev</Btn><Btn variant="default" size="sm" disabled={(page+1)*PS>=filtered.length} onClick={()=>setPage(p=>p+1)}>Next →</Btn></div>
        </div>
      </Card>
    </div>
  );
};

const Donut=({wins,losses})=>{const total=wins+losses,wp=(wins/total)*100,C=2*Math.PI*56,wl=(wp/100)*C;return(
  <div className="flex items-center gap-5">
    <svg width="140" height="140" viewBox="0 0 140 140" className="-rotate-90">
      <circle cx="70" cy="70" r="56" stroke="#f4516c" strokeWidth="14" fill="none" opacity="0.85"/>
      <circle cx="70" cy="70" r="56" stroke="#18c19a" strokeWidth="14" fill="none" strokeDasharray={`${wl} ${C-wl}`} strokeLinecap="butt"/>
      <text x="70" y="68" textAnchor="middle" transform="rotate(90 70 70)" fill="#f5f6f8" fontSize="22" fontWeight="600" fontFamily="Sora">{wp.toFixed(1)}%</text>
      <text x="70" y="86" textAnchor="middle" transform="rotate(90 70 70)" fill="#8a90a0" fontSize="10" fontFamily="JetBrains Mono">WIN RATE</text>
    </svg>
    <div className="space-y-3"><div><div className="flex items-center gap-2 text-xs"><span className="w-2 h-2 rounded-sm bg-up"></span><span className="text-fg2">Winning</span></div><div className="font-display num text-xl font-semibold text-up mt-1">{wins}</div></div><div><div className="flex items-center gap-2 text-xs"><span className="w-2 h-2 rounded-sm bg-down"></span><span className="text-fg2">Losing</span></div><div className="font-display num text-xl font-semibold text-down mt-1">{losses}</div></div></div>
  </div>
)};

const AnalyticsPage=()=>{
  const {EQUITY,MONTHLY,PAIR_PERF,HOURLY,SUMMARY}=window.MOCK;
  const eqData=EQUITY.map(p=>({...p,label:new Date(p.t).toLocaleDateString('en-US',{month:'short',day:'2-digit'})}));
  const max=Math.max(...HOURLY.map(h=>h.v)),days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  return(
    <div className="px-4 md:px-8 py-5 md:py-6 space-y-5">
      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <Card className="lg:col-span-2 p-0">
          <div className="p-5"><CardHeader title="Equity &amp; Drawdown" subtitle="120-day overview" accent/></div>
          <div className="h-[260px] px-2 pb-3"><SvgArea data={eqData} dk="equity" color="#c9f25c" fy={v=>'$'+(v/1000).toFixed(1)+'k'} h={260}/></div>
        </Card>
        <Card>
          <CardHeader title="Drawdown" subtitle="From peak equity" accent/>
          <div className="h-[230px]"><SvgArea data={eqData} dk="drawdown" color="#f4516c" fy={v=>v.toFixed(1)+'%'} h={230}/></div>
          <div className="grid grid-cols-2 gap-3 mt-3 pt-3 border-t border-line"><Metric label="Max DD" value={fmtPct(SUMMARY.maxDD,2,false)} tone="down"/><Metric label="Recovery" value="18d" tone="neutral"/></div>
        </Card>
      </div>
      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <Card className="lg:col-span-2"><CardHeader title="Monthly Returns" subtitle="Net P&L by month" accent/><div className="h-[240px]"><SvgBars data={MONTHLY} dk="return" lk="month" fy={v=>v.toFixed(0)+'%'} h={240}/></div></Card>
        <Card><CardHeader title="Win / Loss Split" accent/><Donut wins={SUMMARY.wins} losses={SUMMARY.losses}/></Card>
      </div>
      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <Card className="lg:col-span-2 p-0">
          <div className="p-5"><CardHeader title="Performance by Pair" subtitle="Cumulative P&L" accent/></div>
          <div className="overflow-x-auto"><table className="w-full text-sm"><thead><tr className="text-left text-[11px] uppercase tracking-wider text-fg3 border-y border-line"><th className="px-5 py-2.5 font-medium">Pair</th><th className="px-3 py-2.5 font-medium text-right">Trades</th><th className="px-3 py-2.5 font-medium text-right">Win Rate</th><th className="px-3 py-2.5 font-medium text-right">P&L</th><th className="px-5 py-2.5 font-medium">Distribution</th></tr></thead><tbody>{PAIR_PERF.map(p=>{const mP=Math.max(...PAIR_PERF.map(x=>Math.abs(x.pnl))),w=Math.abs(p.pnl)/mP*100;return(<tr key={p.pair} className="border-b border-line/60 hover:bg-bg2/40"><td className="px-5 py-2.5"><div className="flex items-center gap-2.5"><PairToken base={p.base} size={20}/><span className="font-display font-medium">{p.pair}</span></div></td><td className="px-3 py-2.5 text-right num text-fg2">{p.trades}</td><td className="px-3 py-2.5 text-right num text-fg1">{p.winRate}%</td><td className={`px-3 py-2.5 text-right num font-medium ${p.pnl>=0?'text-up':'text-down'}`}>{fmtUsd(p.pnl,{sign:true})}</td><td className="px-5 py-2.5 w-[200px]"><div className="h-1.5 rounded-full bg-bg3 overflow-hidden"><div className={`h-full rounded-full ${p.pnl>=0?'bg-up':'bg-down'}`} style={{width:w+'%'}}></div></div></td></tr>)})}</tbody></table></div>
        </Card>
        <Card>
          <CardHeader title="Trading Activity" subtitle="Trades by hour &amp; day (UTC)" accent/>
          <div className="grid grid-cols-[auto_1fr] gap-1.5 mt-1">
            <div></div><div className="grid grid-cols-12 text-[9px] text-fg3 font-mono">{[0,4,8,12,16,20].map(h=><div key={h} className="col-span-2 text-center">{h}h</div>)}</div>
            {days.map((d,di)=><React.Fragment key={d}><div className="text-[10px] text-fg3 font-mono pr-1 leading-[14px]">{d}</div><div className="grid gap-[2px]" style={{gridTemplateColumns:'repeat(24,1fr)'}}>{HOURLY.filter(h=>h.d===di).map(h=>{const a=h.v/max;return<div key={h.h} className="h-[14px] rounded-sm" style={{background:`rgba(201,242,92,${.12+a*.78})`}} title={`${d} ${h.h}h: ${h.v}`}></div>})}</div></React.Fragment>)}
          </div>
          <div className="flex items-center gap-2 mt-4 text-[10px] text-fg3 font-mono"><span>Less</span>{[.15,.35,.55,.75,.95].map((a,i)=><div key={i} className="w-4 h-3 rounded-sm" style={{background:`rgba(201,242,92,${a})`}}></div>)}<span>More</span></div>
        </Card>
      </div>
    </div>
  );
};

const KV=({label,value})=><div><div className="text-[10px] uppercase tracking-wider text-fg3 font-medium">{label}</div><div className="text-sm text-fg1 mt-1">{value}</div></div>;

const ApiSettings=()=>{
  const keys=[{id:1,name:'Primary — Spot',key:'••••••••••••••••••••AB7F',scope:['Read','Trade'],status:'active',ip:'203.0.113.42',added:'Mar 12, 2026'},{id:2,name:'Futures Account',key:'••••••••••••••••••••E91C',scope:['Read','Trade','Futures'],status:'active',ip:'203.0.113.42',added:'Apr 03, 2026'}];
  return<><Card><div className="flex flex-col sm:flex-row items-start gap-3 sm:justify-between"><div><div className="font-display text-lg font-semibold">Connected Exchange API Keys</div><div className="text-sm text-fg2 mt-1">Read-only and trading scopes. Never include withdrawal permissions.</div></div><Btn variant="primary" icon="plus" className="whitespace-nowrap">Add API Key</Btn></div><div className="mt-5 space-y-3">{keys.map(k=><div key={k.id} className="border border-line rounded-lg p-4"><div className="flex flex-wrap items-center gap-3"><div className="w-9 h-9 rounded-md bg-bg3 flex items-center justify-center text-gold shrink-0"><Icon name="key" size={16}/></div><div className="min-w-0"><div className="font-medium font-display">{k.name}</div><div className="font-mono text-xs text-fg3 mt-0.5 truncate">{k.key}</div></div><div className="flex items-center gap-2 w-full sm:w-auto sm:ml-auto"><Pill tone="up">● {k.status}</Pill><Btn variant="ghost" size="sm" icon="copy">Copy</Btn><Btn variant="danger" size="sm">Revoke</Btn></div></div><div className="grid grid-cols-2 sm:grid-cols-4 gap-4 mt-4 pt-4 border-t border-line"><KV label="Scopes" value={<div className="flex gap-1 mt-0.5">{k.scope.map(s=><Pill key={s}>{s}</Pill>)}</div>}/><KV label="IP Whitelist" value={<span className="font-mono text-xs">{k.ip}</span>}/><KV label="Added" value={k.added}/><KV label="Last Used" value="14 minutes ago"/></div></div>)}</div></Card><Card><div className="flex items-start gap-3"><Icon name="shield" size={18} className="text-gold mt-0.5"/><div><div className="font-medium">Security Policy</div><div className="text-sm text-fg2 mt-1 max-w-[640px]">All keys are stored encrypted with AES-256 + a per-user envelope key in HSM. We can never see your secret in plaintext. Withdrawal scope is rejected during ingest.</div></div></div></Card></>;
};

const EaSettings=({eaStatus,setEaStatus})=>{
  const [risk,setRisk]=useState(1.5),[maxPos,setMaxPos]=useState(6),[strategy,setStrategy]=useState('balanced'),[pairs,setPairs]=useState(['BTCUSDT','ETHUSDT','SOLUSDT']);
  const togglePair=p=>setPairs(prev=>prev.includes(p)?prev.filter(x=>x!==p):[...prev,p]);
  return<>
    <Card><div className="flex items-center justify-between"><div><div className="font-display text-lg font-semibold">EA Engine</div><div className="text-sm text-fg2 mt-1">Master control for your Expert Advisor.</div></div><div className="flex items-center gap-3"><span className={`text-sm font-medium ${eaStatus==='active'?'text-up':'text-fg2'}`}>{eaStatus==='active'?'Running':'Paused'}</span><button onClick={()=>setEaStatus(eaStatus==='active'?'paused':'active')} className={`relative w-12 h-6 rounded-full transition-colors ${eaStatus==='active'?'bg-gold':'bg-bg3'}`}><span className={`absolute top-0.5 left-0.5 w-5 h-5 bg-bg0 rounded-full shadow transition-transform ${eaStatus==='active'?'translate-x-6':''}`}></span></button></div></div></Card>
    <Card><CardHeader title="Risk Management" subtitle="Position sizing &amp; exposure caps" accent/><div className="grid grid-cols-2 gap-x-8 gap-y-5"><div><div className="flex items-center justify-between mb-2"><div className="text-sm font-medium">Risk per trade</div><div className="num text-sm text-gold">{risk.toFixed(1)}%</div></div><input type="range" min={0.1} max={5} step={0.1} value={risk} onChange={e=>setRisk(+e.target.value)} className="w-full accent-lime-400"/><div className="text-xs text-fg3 mt-1 font-mono">{(risk*100).toFixed(0)} bps of account equity</div></div><div><div className="flex items-center justify-between mb-2"><div className="text-sm font-medium">Max concurrent positions</div><div className="num text-sm text-gold">{maxPos}</div></div><input type="range" min={1} max={20} step={1} value={maxPos} onChange={e=>setMaxPos(+e.target.value)} className="w-full accent-lime-400"/><div className="text-xs text-fg3 mt-1 font-mono">Across all pairs &amp; strategies</div></div></div></Card>
    <Card><CardHeader title="Strategy" subtitle="Behavior profile for the EA" accent/><div className="grid grid-cols-1 md:grid-cols-3 gap-3">{[{id:'conservative',name:'Conservative',desc:'Slower entries, wider stops, focus on majors.',meta:'~2-3% / mo'},{id:'balanced',name:'Balanced',desc:'Adaptive sizing, mid-frequency trend & mean-reversion.',meta:'~4-7% / mo'},{id:'aggressive',name:'Aggressive',desc:'Higher leverage, more pairs, breakout-heavy.',meta:'~8-14% / mo'}].map(p=><button key={p.id} onClick={()=>setStrategy(p.id)} className={`text-left rounded-lg border p-4 transition-colors ${strategy===p.id?'border-gold/60 bg-gold/5':'border-line hover:border-line2 bg-bg2'}`}><div className="flex items-center justify-between"><div className="font-display font-semibold">{p.name}</div>{strategy===p.id&&<Icon name="check" size={14} className="text-gold"/>}</div><div className="text-xs text-fg2 mt-1.5 leading-relaxed">{p.desc}</div><div className="font-mono text-[10px] text-fg3 mt-3 uppercase tracking-wider">{p.meta}</div></button>)}</div></Card>
    <Card><CardHeader title="Trading Universe" subtitle="Pairs the EA is allowed to trade" accent/><div className="flex flex-wrap gap-2">{window.MOCK.PAIRS.map(p=>{const on=pairs.includes(p.symbol);return<button key={p.symbol} onClick={()=>togglePair(p.symbol)} className={`inline-flex items-center gap-2 px-3 py-2 rounded-md border text-sm transition-colors ${on?'border-gold/50 bg-gold/10 text-fg0':'border-line bg-bg2 text-fg2 hover:text-fg0'}`}><PairToken base={p.base} size={18}/><span className="font-display font-medium">{p.symbol}</span>{on&&<Icon name="check" size={12} className="text-gold"/>}</button>})}</div></Card>
  </>;
};

const NotifySettings=()=>{
  const [prefs,setPrefs]=useState({tradeOpen:{email:true,push:true,tg:false},tradeClose:{email:false,push:true,tg:true},drawdown:{email:true,push:true,tg:true},eaError:{email:true,push:true,tg:true},weekly:{email:true,push:false,tg:false}});
  const rows=[{id:'tradeOpen',label:'Trade opened',desc:'When a new position is entered'},{id:'tradeClose',label:'Trade closed',desc:'When a position is closed (TP/SL or manual)'},{id:'drawdown',label:'Drawdown alert',desc:'When drawdown exceeds 5% from peak'},{id:'eaError',label:'EA error',desc:'Exchange API errors, connection drops, halts'},{id:'weekly',label:'Weekly summary',desc:"Sunday digest with the week's P&L and trades"}];
  const toggle=(row,ch)=>setPrefs(p=>({...p,[row]:{...p[row],[ch]:!p[row][ch]}}));
  return<Card padded={false}><div className="p-5"><CardHeader title="Notifications" subtitle="Choose how you'd like to be reached." accent/></div><table className="w-full text-sm"><thead><tr className="text-left text-[11px] uppercase tracking-wider text-fg3 border-y border-line"><th className="px-5 py-3 font-medium">Event</th><th className="px-3 py-3 font-medium text-center">Email</th><th className="px-3 py-3 font-medium text-center">Push</th><th className="px-5 py-3 font-medium text-center">Telegram</th></tr></thead><tbody>{rows.map(r=><tr key={r.id} className="border-b border-line/60"><td className="px-5 py-4"><div className="font-medium">{r.label}</div><div className="text-xs text-fg3 mt-0.5">{r.desc}</div></td>{['email','push','tg'].map(ch=><td key={ch} className={`py-4 ${ch==='tg'?'px-5':'px-3'} text-center`}><button onClick={()=>toggle(r.id,ch)} className={`relative w-10 h-5 rounded-full transition-colors ${prefs[r.id][ch]?'bg-gold':'bg-bg3'}`}><span className={`absolute top-0.5 left-0.5 w-4 h-4 bg-bg0 rounded-full transition-transform ${prefs[r.id][ch]?'translate-x-5':''}`}></span></button></td>)}</tr>)}</tbody></table></Card>;
};

const SecuritySettings=()=><>
  <Card><CardHeader title="Two-Factor Authentication" accent/><div className="flex items-center justify-between"><div className="text-sm text-fg2 max-w-[480px]">Use an authenticator app (Authy, 1Password, Google Authenticator) to require a 6-digit code on every sign-in.</div><Btn variant="primary">Enable 2FA</Btn></div></Card>
  <Card><CardHeader title="Active Sessions" accent/><div className="space-y-2">{[{d:'MacBook Pro · Chrome 134',ip:'203.0.113.42',city:'Istanbul, TR',when:'Active now',cur:true},{d:'iPhone 16 · SentinelEA iOS',ip:'203.0.113.99',city:'Istanbul, TR',when:'2 hours ago',cur:false},{d:'Linux · Firefox 128',ip:'198.51.100.7',city:'Frankfurt, DE',when:'3 days ago',cur:false}].map((s,i)=><div key={i} className="flex items-center gap-4 p-3 rounded-md hover:bg-bg2/40 border border-transparent hover:border-line"><div className="w-8 h-8 rounded-md bg-bg3 flex items-center justify-center text-fg2"><Icon name="circle" size={14}/></div><div className="flex-1"><div className="text-sm font-medium">{s.d} {s.cur&&<Pill tone="up" className="ml-2">Current</Pill>}</div><div className="text-xs text-fg3 font-mono mt-0.5">{s.ip} · {s.city} · {s.when}</div></div>{!s.cur&&<Btn variant="danger" size="sm">Sign out</Btn>}</div>)}</div></Card>
</>;

const SettingsPage=({eaStatus,setEaStatus})=>{
  const [section,setSection]=useState('api');
  return<div className="px-4 md:px-8 py-5 md:py-6"><div className="grid grid-cols-1 lg:grid-cols-[220px_1fr] gap-6"><div className="flex lg:flex-col gap-1">{[{id:'api',label:'API Keys',icon:'key'},{id:'ea',label:'EA Configuration',icon:'cog'},{id:'notify',label:'Notifications',icon:'bell'},{id:'security',label:'Security',icon:'shield'}].map(s=><button key={s.id} onClick={()=>setSection(s.id)} className={`flex items-center gap-2.5 px-3 py-2.5 rounded-md text-sm transition-colors ${section===s.id?'bg-bg2 text-fg0 border border-line':'text-fg2 hover:text-fg0 border border-transparent'}`}><Icon name={s.icon} size={14}/>{s.label}</button>)}</div><div className="space-y-5">{section==='api'&&<ApiSettings/>}{section==='ea'&&<EaSettings eaStatus={eaStatus} setEaStatus={setEaStatus}/>}{section==='notify'&&<NotifySettings/>}{section==='security'&&<SecuritySettings/>}</div></div></div>;
};

const TITLES={dashboard:{title:'Dashboard',subtitle:'Real-time overview of your Expert Advisor'},trades:{title:'Trade History',subtitle:'Every position the EA has opened and closed'},analytics:{title:'Analytics',subtitle:'Performance breakdown across time, pairs, and risk'},settings:{title:'Settings',subtitle:'API keys, EA configuration, and account preferences'}};

const App=()=>{
  const [authed,setAuthed]=useState(false),[user,setUser]=useState({email:'',name:'Alex Morgan',initials:'AM',tier:'PRO'}),[route,setRoute]=useState('dashboard'),[eaStatus,setEaStatus]=useState('active');
  const onLogin=info=>{setUser(u=>({...u,email:info.email}));setAuthed(true)};
  if(!authed)return<LoginPage onLogin={onLogin}/>;
  const {title,subtitle}=TITLES[route];
  return(
    <div className="flex min-h-screen bg-bg0">
      <Sidebar route={route} setRoute={setRoute} eaStatus={eaStatus} onToggleEa={()=>setEaStatus(s=>s==='active'?'paused':'active')} onLogout={()=>setAuthed(false)}/>
      <main className="flex-1 min-w-0 pb-20 md:pb-0">
        <Topbar title={title} subtitle={subtitle} user={user}/>
        <div>{route==='dashboard'&&<DashboardPage eaStatus={eaStatus}/>}{route==='trades'&&<TradesPage/>}{route==='analytics'&&<AnalyticsPage/>}{route==='settings'&&<SettingsPage eaStatus={eaStatus} setEaStatus={setEaStatus}/>}</div>
      </main>
      <MobileNav route={route} setRoute={setRoute}/>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
